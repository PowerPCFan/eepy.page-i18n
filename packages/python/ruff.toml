exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "site-packages", "venv", "src/tests/**", "scripts/**"]

line-length = 120
target-version = "py311"

[lint]
select = ["ALL"]
ignore = ["UP015", "INP001", "D", "BLE", "T201", "T203", "G004", "ERA", "F821", "FBT001", "FBT002", "TRY300", "RET505", "FLY002", "FIX002", "TD002", "TD003", "S101", "B904", "TRY301", "A001", "A002", "N818", "CPY001"]

fixable = ["ALL"]
unfixable = []

typing-extensions = false

[format]
quote-style = "double"
indent-style = "space"
